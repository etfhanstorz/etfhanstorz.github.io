<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101015" />
  <title>Cube</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <style>
    html, body { margin: 0; height: 100%; background: #101015; color: #eee;
      font-family: system-ui, sans-serif; overflow: hidden; }
    #info { position: fixed; top: 12px; left: 0; width: 100%; text-align: center;
      pointer-events: none; font-size: 14px; opacity: .8; }
  </style>
</head>
<body>
  <div id="info">Put on your headset &amp; press <b>Enter VR</b>. Point at a panel and pull the trigger.</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { VRButton } from 'three/addons/webxr/VRButton.js';
    import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';
    import { XRHandModelFactory } from 'three/addons/webxr/XRHandModelFactory.js';

    // ---- Scene setup ----------------------------------------------------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x101015);

    const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.01, 50);
    camera.position.set(0, 1.6, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(devicePixelRatio);
    renderer.setSize(innerWidth, innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);
    document.body.appendChild(VRButton.createButton(renderer, {
      optionalFeatures: ['hand-tracking', 'local-floor', 'bounded-floor']
    }));

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // ---- Lights ---------------------------------------------------------
    scene.add(new THREE.HemisphereLight(0xffffff, 0x444466, 1.1));
    const dir = new THREE.DirectionalLight(0xffffff, 1.2);
    dir.position.set(1, 3, 2);
    scene.add(dir);

    // A floor so you have a sense of grounding
    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(6, 48).rotateX(-Math.PI / 2),
      new THREE.MeshStandardMaterial({ color: 0x1a1a22, roughness: 1 })
    );
    scene.add(floor);

    // ---- The cube -------------------------------------------------------
    const palette = [0xff4444, 0x44cc66, 0x4488ff, 0xffcc33, 0xaa55ff, 0xffffff];
    let colorIndex = 0;

    const cube = new THREE.Mesh(
      new THREE.BoxGeometry(0.4, 0.4, 0.4),
      new THREE.MeshStandardMaterial({ color: palette[0], roughness: 0.35, metalness: 0.1 })
    );
    cube.position.set(0, 1.5, -1.2);
    scene.add(cube);

    function setColor(i) {
      colorIndex = (i + palette.length) % palette.length;
      cube.material.color.setHex(palette[colorIndex]);
    }

    // ---- Side color buttons (interactive panels) ------------------------
    const buttons = [];
    const buttonGroup = new THREE.Group();
    scene.add(buttonGroup);

    palette.forEach((hex, i) => {
      const panel = new THREE.Mesh(
        new THREE.BoxGeometry(0.16, 0.16, 0.04),
        new THREE.MeshStandardMaterial({ color: hex, roughness: 0.4, emissive: 0x000000 })
      );
      // Stack them vertically to the right of the cube
      panel.position.set(0.55, 1.85 - i * 0.2, -1.2);
      panel.userData.colorIndex = i;
      buttonGroup.add(panel);
      buttons.push(panel);
    });

    // ---- Controllers + raycasting --------------------------------------
    const raycaster = new THREE.Raycaster();
    const tempMatrix = new THREE.Matrix4();
    const controllerModelFactory = new XRControllerModelFactory();
    const handModelFactory = new XRHandModelFactory();

    function buildController(index) {
      // Target-ray space: fires 'selectstart' for BOTH a controller trigger
      // pull and a hand pinch, so one handler covers both input modes.
      const controller = renderer.xr.getController(index);

      // Pointer ray line
      const lineGeom = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, -1)
      ]);
      const line = new THREE.Line(lineGeom, new THREE.LineBasicMaterial({ color: 0xffffff }));
      line.scale.z = 5;
      controller.add(line);

      controller.addEventListener('selectstart', () => onSelect(controller));
      scene.add(controller);

      // Controller grip model (shown when holding a Touch controller)
      const grip = renderer.xr.getControllerGrip(index);
      grip.add(controllerModelFactory.createControllerModel(grip));
      scene.add(grip);

      // Hand model (shown when using hand tracking instead of controllers)
      const hand = renderer.xr.getHand(index);
      hand.add(handModelFactory.createHandModel(hand, 'mesh'));
      scene.add(hand);

      return controller;
    }

    function onSelect(controller) {
      tempMatrix.identity().extractRotation(controller.matrixWorld);
      raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
      raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

      const hits = raycaster.intersectObjects(buttons, false);
      if (hits.length > 0) {
        // Pointed at a panel -> jump to that color
        setColor(hits[0].object.userData.colorIndex);
      } else {
        // Trigger in empty space -> cycle to next color
        setColor(colorIndex + 1);
      }
    }

    const controller0 = buildController(0);
    const controller1 = buildController(1);

    // Highlight the panel currently being pointed at
    function updateHighlight() {
      buttons.forEach(b => b.material.emissive.setHex(0x000000));
      for (const controller of [controller0, controller1]) {
        tempMatrix.identity().extractRotation(controller.matrixWorld);
        raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
        raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);
        const hits = raycaster.intersectObjects(buttons, false);
        if (hits.length > 0) hits[0].object.material.emissive.setHex(0x333333);
      }
    }

    // ---- Render loop ----------------------------------------------------
    renderer.setAnimationLoop(() => {
      cube.rotation.y += 0.01;
      cube.rotation.x += 0.004;
      updateHighlight();
      renderer.render(scene, camera);
    });

    // ---- Register service worker (needed for installable PWA / TWA) -----
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
