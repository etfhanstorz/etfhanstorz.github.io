<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101015" />
  <title>Cube</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #101015; color: #eee;
      font-family: system-ui, sans-serif; overflow: hidden; }

    #crosshair { position: fixed; top: 50%; left: 50%; width: 8px; height: 8px;
      margin: -4px 0 0 -4px; border-radius: 50%; background: rgba(255,255,255,.85);
      pointer-events: none; display: none; }

    /* GUI panel */
    #gui {
      position: fixed; top: 50%; left: 16px; transform: translateY(-50%);
      display: flex; flex-direction: column; gap: 8px;
      background: rgba(10,10,16,.75); backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,.12); border-radius: 14px;
      padding: 12px 10px; z-index: 10; user-select: none;
    }
    #gui .section-label {
      font-size: 10px; font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase; color: rgba(255,255,255,.4);
      text-align: center; margin-bottom: 2px;
    }
    #gui .divider { height: 1px; background: rgba(255,255,255,.1); margin: 2px 0; }

    /* Action buttons */
    #gui button {
      all: unset; cursor: pointer; display: block; width: 100%;
      padding: 9px 14px; border-radius: 9px; font-size: 13px; font-weight: 600;
      text-align: center; color: #fff; transition: filter .1s, transform .1s;
    }
    #gui button:hover  { filter: brightness(1.25); }
    #gui button:active { transform: scale(.95); }
    #gui button.drop   { background: #c0303f; }
    #gui button.drop-s { background: #9b3abf; }
    #gui button.add-c  { background: #2f5fbe; }
    #gui button.add-s  { background: #1f7a52; }
    #gui button.reset  { background: #444658; }
    #gui kbd {
      font: 700 10px system-ui; background: rgba(255,255,255,.18);
      border-radius: 4px; padding: 1px 5px; margin-left: 4px;
    }

    /* Color swatches */
    #swatches { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .swatch {
      width: 34px; height: 34px; border-radius: 7px; cursor: pointer;
      border: 2px solid transparent; transition: border-color .15s, transform .1s;
    }
    .swatch:hover  { border-color: rgba(255,255,255,.7); }
    .swatch:active { transform: scale(.9); }
    .swatch.active { border-color: #fff; }
  </style>
</head>
<body>
  <div id="crosshair"></div>

  <!-- GUI panel — shown in-headset via WebXR DOM overlay -->
  <div id="gui">
    <div class="section-label">Actions</div>
    <button class="drop"   onclick="dropBoxes()">Drop Box <kbd>D</kbd></button>
    <button class="drop-s" onclick="dropSpheres()">Drop Sphere <kbd>F</kbd></button>
    <button class="add-c"  onclick="addCube()">Add Cube <kbd>G</kbd></button>
    <button class="add-s"  onclick="addSphere()">Add Sphere <kbd>H</kbd></button>
    <button class="reset"  onclick="resetCubes()">Reset</button>
    <div class="divider"></div>
    <div class="section-label">Color</div>
    <div id="swatches"></div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import * as CANNON from 'cannon-es';
    import { VRButton } from 'three/addons/webxr/VRButton.js';
    import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';
    import { XRHandModelFactory } from 'three/addons/webxr/XRHandModelFactory.js';
    import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

    // ---- Renderer / scene / camera -------------------------------------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x101015);

    const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.01, 50);
    camera.position.set(0, 1.6, 0); // default eye height for non-VR preview; XR overrides this

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(devicePixelRatio);
    renderer.setSize(innerWidth, innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);
    document.body.appendChild(VRButton.createButton(renderer, {
      optionalFeatures: ['hand-tracking', 'local-floor', 'bounded-floor'],
      domOverlay: { root: document.getElementById('gui') }
    }));

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // Player rig: the joystick moves this, carrying camera + hands + controllers.
    const player = new THREE.Group();
    player.add(camera);
    scene.add(player);

    // ---- Lights & floor -------------------------------------------------
    scene.add(new THREE.HemisphereLight(0xffffff, 0x444466, 1.1));
    const dir = new THREE.DirectionalLight(0xffffff, 1.2);
    dir.position.set(1, 3, 2);
    scene.add(dir);

    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(8, 48).rotateX(-Math.PI / 2),
      new THREE.MeshStandardMaterial({ color: 0x1a1a22, roughness: 1 })
    );
    scene.add(floor);

    // ---- Physics world --------------------------------------------------
    const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -9.82, 0) });
    world.broadphase = new CANNON.SAPBroadphase(world);
    world.defaultContactMaterial.restitution = 0.25;

    const floorBody = new CANNON.Body({ type: CANNON.Body.STATIC, shape: new CANNON.Plane() });
    floorBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
    world.addBody(floorBody);

    // ---- Cubes ----------------------------------------------------------
    const palette = [0xff4444, 0x44cc66, 0x4488ff, 0xffcc33, 0xaa55ff, 0xffffff];
    let colorIndex = 0;

    const SIZE = 0.4, HALF = SIZE / 2, RAD = SIZE / 2;
    const boxGeo = new THREE.BoxGeometry(SIZE, SIZE, SIZE);
    const sphereGeo = new THREE.SphereGeometry(RAD, 32, 24);
    const cubes = []; // { mesh, body, dropped, grabbed } — holds both cubes and spheres

    function spawnCube(pos, colorHex) {
      const mesh = new THREE.Mesh(
        boxGeo,
        new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.35, metalness: 0.1 })
      );
      mesh.position.copy(pos);
      scene.add(mesh);

      const body = new CANNON.Body({
        mass: 1,
        shape: new CANNON.Box(new CANNON.Vec3(HALF, HALF, HALF)),
        position: new CANNON.Vec3(pos.x, pos.y, pos.z)
      });
      body.type = CANNON.Body.STATIC; // floats until dropped or grabbed
      body.sleep();
      world.addBody(body);

      cubes.push({ mesh, body, dropped: false, grabbed: false, kind: 'cube' });
    }

    // Color swatch = GLOBAL: repaint every object the same color.
    function setColorAll(i) {
      colorIndex = (i + palette.length) % palette.length;
      cubes.forEach(c => c.mesh.material.color.setHex(palette[colorIndex]));
      swatchEls.forEach((el, j) => el.classList.toggle('active', j === colorIndex));
    }

    function dropObjects(kind) {
      cubes.forEach(c => {
        if (c.kind !== kind || c.dropped || c.grabbed) return;
        c.dropped = true;
        c.body.type = CANNON.Body.DYNAMIC;
        c.body.mass = 1;
        c.body.updateMassProperties();
        c.body.wakeUp();
        c.body.angularVelocity.set(
          (Math.random() - 0.5) * 4, (Math.random() - 0.5) * 4, (Math.random() - 0.5) * 4
        );
      });
    }
    function dropBoxes()   { dropObjects('cube'); }
    function dropSpheres() { dropObjects('sphere'); }

    function spawnSphere(pos, colorHex) {
      const mesh = new THREE.Mesh(
        sphereGeo,
        new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.3, metalness: 0.15 })
      );
      mesh.position.copy(pos);
      scene.add(mesh);

      const body = new CANNON.Body({
        mass: 1,
        shape: new CANNON.Sphere(RAD),
        position: new CANNON.Vec3(pos.x, pos.y, pos.z)
      });
      body.type = CANNON.Body.STATIC;
      body.sleep();
      world.addBody(body);

      cubes.push({ mesh, body, dropped: false, grabbed: false, kind: 'sphere' });
    }

    // Each added cube/sphere gets its OWN random color from the palette.
    function addCube() {
      const hex = palette[Math.floor(Math.random() * palette.length)];
      spawnCube(new THREE.Vector3(
        -0.6 + Math.random() * 1.2, 1.6 + Math.random() * 0.3, -1.2 + (Math.random() - 0.5) * 0.4
      ), hex);
    }

    function addSphere() {
      const hex = palette[Math.floor(Math.random() * palette.length)];
      spawnSphere(new THREE.Vector3(
        -0.6 + Math.random() * 1.2, 1.6 + Math.random() * 0.3, -1.2 + (Math.random() - 0.5) * 0.4
      ), hex);
    }

    function resetCubes() {
      for (const c of cubes) {
        scene.remove(c.mesh);
        c.mesh.material.dispose();
        world.removeBody(c.body);
      }
      cubes.length = 0;
      controllers.forEach(ctrl => (ctrl.userData.grab = null));
      colorIndex = 0;
      spawnCube(new THREE.Vector3(-0.3, 1.5, -1.2), palette[0]);
      spawnSphere(new THREE.Vector3(0.3, 1.5, -1.2), palette[2]);
    }

    spawnCube(new THREE.Vector3(-0.3, 1.5, -1.2), palette[0]);   // first cube
    spawnSphere(new THREE.Vector3(0.3, 1.5, -1.2), palette[2]);  // first sphere

    // ---- HTML GUI swatches ---------------------------------------------
    const swatchEls = [];
    const swatchContainer = document.getElementById('swatches');
    palette.forEach((hex, i) => {
      const el = document.createElement('div');
      el.className = 'swatch' + (i === 0 ? ' active' : '');
      el.style.background = '#' + hex.toString(16).padStart(6, '0');
      el.addEventListener('click', () => setColorAll(i));
      swatchContainer.appendChild(el);
      swatchEls.push(el);
    });

    // expose actions to HTML onclick attributes
    Object.assign(window, { dropBoxes, dropSpheres, addCube, addSphere, resetCubes });

    // ---- Controllers, hands, grab ---------------------------------------
    const raycaster = new THREE.Raycaster();
    const tempMatrix = new THREE.Matrix4();
    const controllerModelFactory = new XRControllerModelFactory();
    const handModelFactory = new XRHandModelFactory();
    const controllers = [];
    const GRAB_R = 0.28;

    const _cp = new THREE.Vector3();
    function onGrabStart(controller) {
      controller.getWorldPosition(_cp);
      let best = null, bestD = GRAB_R;
      for (const c of cubes) {
        const d = c.mesh.position.distanceTo(_cp);
        if (d < bestD) { bestD = d; best = c; }
      }
      if (!best) return;
      controller.userData.grab = best;
      best.grabbed = true;
      best.body.type = CANNON.Body.KINEMATIC;
      best.body.updateMassProperties();
      best.body.wakeUp();
    }

    function onGrabEnd(controller) {
      const c = controller.userData.grab;
      if (!c) return;
      controller.userData.grab = null;
      c.grabbed = false;
      c.dropped = true;
      c.body.type = CANNON.Body.DYNAMIC;
      c.body.mass = 1;
      c.body.updateMassProperties();
      c.body.wakeUp();
      const v = controller.userData.vel || new THREE.Vector3();
      c.body.velocity.set(v.x, v.y, v.z);
    }

    function buildController(index) {
      const controller = renderer.xr.getController(index);
      const lineGeom = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, -1)
      ]);
      const line = new THREE.Line(lineGeom, new THREE.LineBasicMaterial({ color: 0xffffff, opacity: 0.5, transparent: true }));
      line.scale.z = 4;
      controller.add(line);
      controller.addEventListener('squeezestart', () => onGrabStart(controller));
      controller.addEventListener('squeezeend',   () => onGrabEnd(controller));
      player.add(controller);

      const grip = renderer.xr.getControllerGrip(index);
      grip.add(controllerModelFactory.createControllerModel(grip));
      player.add(grip);

      const hand = renderer.xr.getHand(index);
      hand.add(handModelFactory.createHandModel(hand, 'mesh'));
      player.add(hand);

      controllers.push(controller);
    }

    buildController(0);
    buildController(1);

    // ---- Desktop (PC) controls: mouse-look + WASD + right-click grab ----
    const controls = new PointerLockControls(camera, renderer.domElement);
    const crosshair = document.getElementById('crosshair');
    const keys = {};
    const screenCenter = new THREE.Vector2(0, 0);
    let heldCube = null;
    const desktopThrow = new THREE.Vector3();
    const camPos = new THREE.Vector3(), camDir = new THREE.Vector3();
    const targetPos = new THREE.Vector3(), prevHeld = new THREE.Vector3();

    controls.addEventListener('lock',   () => (crosshair.style.display = 'block'));
    controls.addEventListener('unlock', () => (crosshair.style.display = 'none'));

    addEventListener('keydown', e => {
      keys[e.code] = true;
      if (e.target.tagName === 'BUTTON') return; // don't fire when clicking GUI
      switch (e.code) {
        case 'KeyD': dropBoxes();   break;
        case 'KeyF': dropSpheres(); break;
        case 'KeyG': addCube();     break;
        case 'KeyH': addSphere();   break;
      }
    });
    addEventListener('keyup', e => (keys[e.code] = false));

    function desktopGrabStart() {
      raycaster.setFromCamera(screenCenter, camera);
      const hits = raycaster.intersectObjects(cubes.map(c => c.mesh), false);
      if (!hits.length) return;
      const c = cubes.find(x => x.mesh === hits[0].object);
      if (!c) return;
      heldCube = c;
      c.grabbed = true;
      c.grabDist = Math.max(0.6, hits[0].distance);
      c.body.type = CANNON.Body.KINEMATIC;
      c.body.updateMassProperties();
      c.body.wakeUp();
      camera.getWorldPosition(camPos); camera.getWorldDirection(camDir);
      prevHeld.copy(camPos).addScaledVector(camDir, c.grabDist);
    }

    function desktopGrabEnd() {
      if (!heldCube) return;
      const c = heldCube; heldCube = null;
      c.grabbed = false; c.dropped = true;
      c.body.type = CANNON.Body.DYNAMIC;
      c.body.mass = 1;
      c.body.updateMassProperties();
      c.body.wakeUp();
      c.body.velocity.set(desktopThrow.x, desktopThrow.y, desktopThrow.z);
    }

    renderer.domElement.addEventListener('click', () => {
      if (renderer.xr.isPresenting) return;
      if (!controls.isLocked) controls.lock();
    });
    renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());
    renderer.domElement.addEventListener('mousedown', e => {
      if (e.button === 2 && controls.isLocked && !renderer.xr.isPresenting) desktopGrabStart();
    });
    addEventListener('mouseup', e => { if (e.button === 2) desktopGrabEnd(); });

    function desktopUpdate(dt) {
      if (renderer.xr.isPresenting || !controls.isLocked) return;
      const s = SPEED * dt;
      if (keys['KeyW'] || keys['ArrowUp'])    controls.moveForward(s);
      if (keys['KeyS'] || keys['ArrowDown'])  controls.moveForward(-s);
      if (keys['KeyA'] || keys['ArrowLeft'])  controls.moveRight(-s);
      if (keys['KeyD'] || keys['ArrowRight']) controls.moveRight(s);

      if (heldCube) {
        camera.getWorldPosition(camPos); camera.getWorldDirection(camDir);
        targetPos.copy(camPos).addScaledVector(camDir, heldCube.grabDist);
        desktopThrow.copy(targetPos).sub(prevHeld).multiplyScalar(1 / Math.max(dt, 1e-3));
        prevHeld.copy(targetPos);
        heldCube.body.position.set(targetPos.x, targetPos.y, targetPos.z);
        heldCube.body.velocity.set(desktopThrow.x, desktopThrow.y, desktopThrow.z);
        heldCube.body.angularVelocity.set(0, 0, 0);
        heldCube.mesh.position.copy(targetPos);
      }
    }

    // ---- Joystick locomotion -------------------------------------------
    const SPEED = 2.2, DEAD = 0.2, TURN = Math.PI / 6;
    let canTurn = true;
    const fwd = new THREE.Vector3(), right = new THREE.Vector3();
    const headQuat = new THREE.Quaternion(), headPos = new THREE.Vector3();

    function locomotion(dt) {
      const session = renderer.xr.getSession();
      if (!session) return;
      for (const src of session.inputSources) {
        if (!src.gamepad || !src.handedness) continue;
        const ax = src.gamepad.axes;
        const x = ax.length > 2 ? ax[2] : ax[0];
        const y = ax.length > 3 ? ax[3] : ax[1];

        if (src.handedness === 'left') {
          if (Math.abs(x) < DEAD && Math.abs(y) < DEAD) continue;
          camera.getWorldQuaternion(headQuat);
          fwd.set(0, 0, -1).applyQuaternion(headQuat); fwd.y = 0; fwd.normalize();
          right.set(1, 0, 0).applyQuaternion(headQuat); right.y = 0; right.normalize();
          player.position.addScaledVector(fwd, -y * SPEED * dt);
          player.position.addScaledVector(right, x * SPEED * dt);
        } else if (src.handedness === 'right') {
          if (Math.abs(x) < 0.6) { canTurn = true; continue; }
          if (!canTurn) continue;
          canTurn = false;
          const angle = x > 0 ? -TURN : TURN;
          camera.getWorldPosition(headPos);
          player.position.sub(headPos);
          player.position.applyAxisAngle(new THREE.Vector3(0, 1, 0), angle);
          player.position.add(headPos);
          player.rotateY(angle);
        }
      }
    }

    // ---- Grab tracking: move held cubes + measure throw velocity --------
    function updateGrab(dt) {
      for (const controller of controllers) {
        controller.getWorldPosition(_cp);
        const prev = controller.userData.prev;
        if (prev) {
          controller.userData.vel = _cp.clone().sub(prev).multiplyScalar(1 / Math.max(dt, 1e-3));
        }
        controller.userData.prev = _cp.clone();

        const c = controller.userData.grab;
        if (c) {
          c.body.position.set(_cp.x, _cp.y, _cp.z);
          const v = controller.userData.vel || new THREE.Vector3();
          c.body.velocity.set(v.x, v.y, v.z); // so it pushes other cubes while held
          c.body.angularVelocity.set(0, 0, 0);
          c.mesh.position.copy(_cp);
        }
      }
    }

    // ---- Loop -----------------------------------------------------------
    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => {
      const dt = Math.min(clock.getDelta(), 0.05);
      locomotion(dt);
      updateGrab(dt);
      desktopUpdate(dt);

      world.step(1 / 60, dt, 3);

      for (const c of cubes) {
        if (c.grabbed) continue;           // position set in updateGrab
        if (c.dropped) {
          c.mesh.position.copy(c.body.position);
          c.mesh.quaternion.copy(c.body.quaternion);
        } else {
          c.mesh.rotation.y += 0.01;
          c.mesh.rotation.x += 0.004;
        }
      }

      renderer.render(scene, camera);
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
